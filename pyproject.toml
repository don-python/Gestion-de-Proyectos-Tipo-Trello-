[project]
name = "gestion-trello"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maximoleonardocarrillosreyes-design", email = "maximoleonardocarrillosreyes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "peewee>=4.5.3",
    "prettytable>=3.18.0",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "maskpass>=0.3.7,<0.4",
    "bcrypt>=4.0.0",
]

[project.scripts]
gestion-trello = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crud*", "orm*"]
exclude = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
